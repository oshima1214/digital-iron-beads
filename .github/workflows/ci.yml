name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run web:export
      # iOS 用の JS バンドルが作れることを確認する（Web 専用のコードが混ざると失敗する）
      - run: npx expo export -p ios --output-dir dist-ios
